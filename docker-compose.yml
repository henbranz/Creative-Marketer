services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-creative_marketer}
      POSTGRES_USER: ${POSTGRES_USER:-creative_marketer_migrator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-creative_marketer_migrator}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro

  migrate:
    build:
      context: ./apps/api
    command: ["alembic", "upgrade", "head"]
    env_file:
      - path: .env
        required: false
    environment:
      MIGRATION_DATABASE_URL: postgresql+psycopg://creative_marketer_migrator:creative_marketer_migrator@postgres:5432/creative_marketer
    depends_on:
      postgres:
        condition: service_healthy

  object-storage:
    image: quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORAGE_ACCESS_KEY_ID:-creative-marketer-local}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORAGE_SECRET_ACCESS_KEY:-creative-marketer-local-secret}
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:3000
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - object-storage-data:/data

  object-storage-init:
    build:
      context: ./apps/api
    command:
      [
        "python",
        "-m",
        "creative_marketer.infrastructure.object_storage.bootstrap",
      ]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://creative_marketer_runtime:creative_marketer_runtime@postgres:5432/creative_marketer
      AUDIT_FINGERPRINT_KEY: local-only-audit-fingerprint-key-change-me
      CORS_ORIGINS: '["http://localhost:3000"]'
      OBJECT_STORAGE_BACKEND: s3
      OBJECT_STORAGE_ENDPOINT_URL: http://object-storage:9000
      OBJECT_STORAGE_PUBLIC_ENDPOINT_URL: http://localhost:9000
      OBJECT_STORAGE_ACCESS_KEY_ID: ${OBJECT_STORAGE_ACCESS_KEY_ID:-creative-marketer-local}
      OBJECT_STORAGE_SECRET_ACCESS_KEY: ${OBJECT_STORAGE_SECRET_ACCESS_KEY:-creative-marketer-local-secret}
      MODEL_PROVIDER_BACKEND: ${MODEL_PROVIDER_BACKEND:-disabled}
    depends_on:
      - object-storage

  api:
    build:
      context: ./apps/api
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: development
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      DATABASE_URL: postgresql+psycopg://creative_marketer_runtime:creative_marketer_runtime@postgres:5432/creative_marketer
      DEV_IDENTITY_ENABLED: "true"
      AUDIT_FINGERPRINT_KEY: local-only-audit-fingerprint-key-change-me
      CORS_ORIGINS: '["http://localhost:3000"]'
      OBJECT_STORAGE_BACKEND: s3
      OBJECT_STORAGE_ENDPOINT_URL: http://object-storage:9000
      OBJECT_STORAGE_PUBLIC_ENDPOINT_URL: http://localhost:9000
      OBJECT_STORAGE_ACCESS_KEY_ID: ${OBJECT_STORAGE_ACCESS_KEY_ID:-creative-marketer-local}
      OBJECT_STORAGE_SECRET_ACCESS_KEY: ${OBJECT_STORAGE_SECRET_ACCESS_KEY:-creative-marketer-local-secret}
      MODEL_PROVIDER_BACKEND: ${MODEL_PROVIDER_BACKEND:-disabled}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      MEDIA_IMAGE_PROVIDER: ${MEDIA_IMAGE_PROVIDER:-disabled}
      MEDIA_VIDEO_PROVIDER: ${MEDIA_VIDEO_PROVIDER:-disabled}
      BYTEPLUS_LAS_API_KEY: ${BYTEPLUS_LAS_API_KEY:-}
      BYTEPLUS_LAS_BASE_URL: ${BYTEPLUS_LAS_BASE_URL:-https://operator.las.ap-southeast-1.bytepluses.com}
      ALLOW_BILLABLE_MEDIA: ${ALLOW_BILLABLE_MEDIA:-false}
      RUN_LIVE_E2E: ${RUN_LIVE_E2E:-}
      LIVE_E2E_MAX_USD: ${LIVE_E2E_MAX_USD:-10}
      LIVE_E2E_PRODUCT_ID: ${LIVE_E2E_PRODUCT_ID:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "8000:8000"

  event-publisher:
    build:
      context: ./apps/api
    command: ["python", "-m", "creative_marketer.events.worker"]
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://creative_marketer_runtime:creative_marketer_runtime@postgres:5432/creative_marketer
      EVENT_PUBLISHER_DATABASE_URL: postgresql+psycopg://creative_marketer_event_publisher:creative_marketer_event_publisher@postgres:5432/creative_marketer
      AUDIT_FINGERPRINT_KEY: local-only-audit-fingerprint-key-change-me
    profiles: ["event-worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  temporal:
    image: temporalio/temporal:1.8.1
    command:
      [
        "server",
        "start-dev",
        "--ip",
        "0.0.0.0",
        "--db-filename",
        "/var/lib/temporal/temporal.db",
      ]
    profiles: ["temporal"]
    ports:
      - "7233:7233"
      - "8233:8233"
    volumes:
      - temporal-data:/var/lib/temporal

  researcher-worker:
    build:
      context: ./apps/api
    command: ["python", "-m", "creative_marketer_api.researcher_worker"]
    profiles: ["temporal"]
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://creative_marketer_runtime:creative_marketer_runtime@postgres:5432/creative_marketer
      EVENT_PUBLISHER_DATABASE_URL: postgresql+psycopg://creative_marketer_event_publisher:creative_marketer_event_publisher@postgres:5432/creative_marketer
      AUDIT_FINGERPRINT_KEY: local-only-audit-fingerprint-key-change-me
      TEMPORAL_ADDRESS: temporal:7233
      MODEL_PROVIDER_BACKEND: ${MODEL_PROVIDER_BACKEND:-disabled}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ALLOW_BILLABLE_MEDIA: ${ALLOW_BILLABLE_MEDIA:-false}
      RUN_LIVE_E2E: ${RUN_LIVE_E2E:-}
      LIVE_E2E_MAX_USD: ${LIVE_E2E_MAX_USD:-10}
      LIVE_E2E_PRODUCT_ID: ${LIVE_E2E_PRODUCT_ID:-}
      AGENT_WORKLOAD_ID: ${AGENT_WORKLOAD_ID:-local-agent-worker}
    depends_on:
      migrate:
        condition: service_completed_successfully
      temporal:
        condition: service_started

  assembly-worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.assembly
    profiles: ["temporal"]
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://creative_marketer_runtime:creative_marketer_runtime@postgres:5432/creative_marketer
      EVENT_PUBLISHER_DATABASE_URL: postgresql+psycopg://creative_marketer_event_publisher:creative_marketer_event_publisher@postgres:5432/creative_marketer
      AUDIT_FINGERPRINT_KEY: local-only-audit-fingerprint-key-change-me
      CORS_ORIGINS: '["http://localhost:3000"]'
      OBJECT_STORAGE_BACKEND: s3
      OBJECT_STORAGE_ENDPOINT_URL: http://object-storage:9000
      OBJECT_STORAGE_PUBLIC_ENDPOINT_URL: http://localhost:9000
      OBJECT_STORAGE_ACCESS_KEY_ID: ${OBJECT_STORAGE_ACCESS_KEY_ID:-creative-marketer-local}
      OBJECT_STORAGE_SECRET_ACCESS_KEY: ${OBJECT_STORAGE_SECRET_ACCESS_KEY:-creative-marketer-local-secret}
      TEMPORAL_ADDRESS: temporal:7233
      ASSEMBLY_WORKLOAD_ID: local-assembly-worker
    depends_on:
      migrate:
        condition: service_completed_successfully
      temporal:
        condition: service_started
      object-storage:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
        NEXT_PUBLIC_OBSIDIAN_VAULT_NAME: ${NEXT_PUBLIC_OBSIDIAN_VAULT_NAME:-}
    env_file:
      - path: .env
        required: false
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
      NEXT_PUBLIC_OBSIDIAN_VAULT_NAME: ${NEXT_PUBLIC_OBSIDIAN_VAULT_NAME:-}
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  postgres-data:
  temporal-data:
  object-storage-data:
