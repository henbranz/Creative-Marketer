name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  architecture-security:
    name: architecture-security
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: creative_marketer
          POSTGRES_USER: creative_marketer_migrator
          POSTGRES_PASSWORD: creative_marketer_migrator
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U creative_marketer_migrator -d creative_marketer"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://creative_marketer_runtime:creative_marketer_runtime@localhost:5432/creative_marketer
      MIGRATION_DATABASE_URL: postgresql+psycopg://creative_marketer_migrator:creative_marketer_migrator@localhost:5432/creative_marketer
      AUDIT_FINGERPRINT_KEY: ci-only-audit-fingerprint-key-32-bytes
      TEST_DATABASE_ADMIN_URL: postgresql+psycopg://creative_marketer_migrator:creative_marketer_migrator@localhost:5432/creative_marketer
      TEST_DATABASE_RUNTIME_URL: postgresql+psycopg://creative_marketer_runtime:creative_marketer_runtime@localhost:5432/creative_marketer
      TEST_DATABASE_PUBLISHER_URL: postgresql+psycopg://creative_marketer_event_publisher:creative_marketer_event_publisher@localhost:5432/creative_marketer
      TEST_OBJECT_STORAGE_URL: http://localhost:9000
      OBJECT_STORAGE_BACKEND: s3
      OBJECT_STORAGE_ENDPOINT_URL: http://localhost:9000
      OBJECT_STORAGE_PUBLIC_ENDPOINT_URL: http://localhost:9000
      OBJECT_STORAGE_ACCESS_KEY_ID: creative-marketer-test
      OBJECT_STORAGE_SECRET_ACCESS_KEY: creative-marketer-test-secret
      CORS_ORIGINS: '["http://localhost:3000"]'
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --frozen
      - name: Start private S3-compatible storage
        run: docker run -d --name creative-marketer-minio -p 9000:9000 -e MINIO_ROOT_USER=creative-marketer-test -e MINIO_ROOT_PASSWORD=creative-marketer-test-secret -e MINIO_API_CORS_ALLOW_ORIGIN=http://localhost:3000 minio/minio:RELEASE.2025-09-07T16-13-09Z server /data
      - run: uv run python -m creative_marketer.infrastructure.object_storage.bootstrap
      - run: PGPASSWORD=creative_marketer_migrator psql -h localhost -U creative_marketer_migrator -d creative_marketer -f ../../infra/postgres/init/001-runtime-role.sql
      - run: uv run alembic upgrade 20260905_0001
      - run: PGPASSWORD=creative_marketer_migrator psql -h localhost -U creative_marketer_migrator -d creative_marketer -c "INSERT INTO identity.users (id, external_identity_issuer, external_identity_subject, email, normalized_email, status) VALUES ('00000000-0000-0000-0000-000000000003', 'https://legacy.example', 'LegacySubject', 'legacy@example.test', 'legacy@example.test', 'active')"
      - run: uv run alembic upgrade head
      - run: PGPASSWORD=creative_marketer_migrator psql -h localhost -U creative_marketer_migrator -d creative_marketer -c "INSERT INTO identity.tenants (id,name,slug,status) VALUES ('00000000-0000-0000-0000-000000000013','Asset downgrade','asset-downgrade','active'); INSERT INTO identity.users (id,email,normalized_email,status) VALUES ('00000000-0000-0000-0000-000000000013','asset-downgrade@example.test','asset-downgrade@example.test','active'); INSERT INTO catalog.brands (id,tenant_id,name,slug,status,created_by) VALUES ('00000000-0000-0000-0000-000000000013','00000000-0000-0000-0000-000000000013','Asset downgrade','asset-downgrade','active','00000000-0000-0000-0000-000000000013'); INSERT INTO catalog.assets (id,tenant_id,brand_id,kind,role,origin,status,original_filename,declared_mime_type,rights_status,allowed_uses,upload_object_key,created_by) VALUES ('00000000-0000-0000-0000-000000000013','00000000-0000-0000-0000-000000000013','00000000-0000-0000-0000-000000000013','image','other','user_upload','pending_upload','proof.png','image/png','unknown','[\"internal_analysis\"]','tenants/00000000-0000-0000-0000-000000000013/assets/00000000-0000-0000-0000-000000000013/uploads/proof','00000000-0000-0000-0000-000000000013')"
      - name: Verify lossy Asset Library downgrade fails closed
        run: |
          if uv run alembic downgrade 20260905_0012; then
            echo "lossy Asset Library downgrade unexpectedly succeeded" >&2
            exit 1
          fi
      - run: PGPASSWORD=creative_marketer_migrator psql -h localhost -U creative_marketer_migrator -d creative_marketer -c "DELETE FROM catalog.assets WHERE id='00000000-0000-0000-0000-000000000013'; DELETE FROM catalog.brands WHERE id='00000000-0000-0000-0000-000000000013'; DELETE FROM identity.users WHERE id='00000000-0000-0000-0000-000000000013'; DELETE FROM identity.tenants WHERE id='00000000-0000-0000-0000-000000000013'"
      - run: PGPASSWORD=creative_marketer_migrator psql -h localhost -U creative_marketer_migrator -d creative_marketer -f tests/migration/verify_0002_backfill.sql
      - run: uv run alembic downgrade base
      - run: uv run alembic upgrade head
      - run: PGPASSWORD=creative_marketer_migrator psql -h localhost -U creative_marketer_migrator -d creative_marketer -f tests/migration/prepare_tool_gateway_lossy_downgrade.sql
      - name: Verify lossy Tool Gateway downgrade fails closed
        run: |
          if uv run alembic downgrade 20260905_0008; then
            echo "lossy Tool Gateway downgrade unexpectedly succeeded" >&2
            exit 1
          fi
      - run: PGPASSWORD=creative_marketer_migrator psql -h localhost -U creative_marketer_migrator -d creative_marketer -c "DELETE FROM audit.audit_records WHERE id='00000000-0000-0000-0000-000000000010'"
      - run: PGPASSWORD=creative_marketer_migrator psql -h localhost -U creative_marketer_migrator -d creative_marketer -f tests/migration/prepare_event_delivery_lossy_downgrade.sql
      - name: Verify lossy event-delivery downgrade fails closed
        run: |
          if uv run alembic downgrade 20260905_0007; then
            echo "lossy event-delivery downgrade unexpectedly succeeded" >&2
            exit 1
          fi
      - run: PGPASSWORD=creative_marketer_migrator psql -h localhost -U creative_marketer_migrator -d creative_marketer -c "DELETE FROM event_delivery.outbox_events WHERE event_id='00000000-0000-0000-0000-000000000009'; DELETE FROM identity.tenants WHERE id='00000000-0000-0000-0000-000000000009'"
      - run: PGPASSWORD=creative_marketer_migrator psql -h localhost -U creative_marketer_migrator -d creative_marketer -f tests/migration/prepare_approval_idempotency_lossy_downgrade.sql
      - name: Verify lossy Approval and Idempotency downgrade fails closed
        run: |
          if uv run alembic downgrade 20260905_0006; then
            echo "lossy Approval/Idempotency downgrade unexpectedly succeeded" >&2
            exit 1
          fi
      - run: PGPASSWORD=creative_marketer_migrator psql -h localhost -U creative_marketer_migrator -d creative_marketer -c "DELETE FROM audit.audit_records WHERE id='00000000-0000-0000-0000-000000000008'"
      - run: PGPASSWORD=creative_marketer_migrator psql -h localhost -U creative_marketer_migrator -d creative_marketer -f tests/migration/prepare_permission_lossy_downgrade.sql
      - name: Verify lossy Permission Policy downgrade fails closed
        run: |
          if uv run alembic downgrade 20260905_0005; then
            echo "lossy Permission Policy downgrade unexpectedly succeeded" >&2
            exit 1
          fi
      - run: PGPASSWORD=creative_marketer_migrator psql -h localhost -U creative_marketer_migrator -d creative_marketer -c "DELETE FROM permission_governance.tool_permissions WHERE id='00000000-0000-0000-0000-000000000007'; DELETE FROM agent_governance.agent_definitions WHERE id='00000000-0000-0000-0000-000000000007'; DELETE FROM tool_governance.tool_definitions WHERE id='00000000-0000-0000-0000-000000000007'; DELETE FROM identity.tenants WHERE id='00000000-0000-0000-0000-000000000007'"
      - run: PGPASSWORD=creative_marketer_migrator psql -h localhost -U creative_marketer_migrator -d creative_marketer -f tests/migration/prepare_tool_registry_lossy_downgrade.sql
      - name: Verify lossy Tool Registry downgrade fails closed
        run: |
          if uv run alembic downgrade 20260905_0004; then
            echo "lossy Tool Registry downgrade unexpectedly succeeded" >&2
            exit 1
          fi
      - run: PGPASSWORD=creative_marketer_migrator psql -h localhost -U creative_marketer_migrator -d creative_marketer -c "DELETE FROM tool_governance.tool_definitions WHERE id='00000000-0000-0000-0000-000000000006'"
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src tests
      - run: uv run pytest
      - run: PGPASSWORD=creative_marketer_migrator psql -h localhost -U creative_marketer_migrator -d creative_marketer -f tests/migration/prepare_lossy_downgrade.sql
      - name: Verify lossy identity downgrade fails closed
        run: |
          if uv run alembic downgrade 20260905_0001; then
            echo "lossy identity downgrade unexpectedly succeeded" >&2
            exit 1
          fi

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"
      - run: npm ci
      - run: uv sync --frozen --project apps/api
      - run: npm run contracts:check
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000

  temporal:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run pytest -m temporal --no-cov

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
