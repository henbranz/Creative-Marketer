[project]
name = "creative-marketer-api"
version = "0.1.0"
description = "Creative Marketer platform API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16.0,<2.0.0",
  "fastapi>=0.116.0,<1.0.0",
  "jsonschema>=4.25.0,<5.0.0",
  "pydantic-settings>=2.10.0,<3.0.0",
  "psycopg[binary]>=3.2.9,<4.0.0",
  "sqlalchemy[asyncio]>=2.0.41,<3.0.0",
  "uvicorn[standard]>=0.35.0,<1.0.0",
  "opentelemetry-api>=1.37.0,<2.0.0",
  "opentelemetry-sdk>=1.37.0,<2.0.0",
  "opentelemetry-exporter-otlp-proto-http>=1.37.0,<2.0.0",
  "temporalio>=1.32.0,<1.33.0",
]

[dependency-groups]
dev = [
  "httpx>=0.28.0,<1.0.0",
  "mypy>=1.17.0,<2.0.0",
  "pre-commit>=4.3.0,<5.0.0",
  "pytest>=8.4.0,<9.0.0",
  "pytest-cov>=6.2.0,<7.0.0",
  "pytest-asyncio>=1.1.0,<2.0.0",
  "ruff>=0.13.0,<1.0.0",
  "types-jsonschema>=4.25.1,<5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/creative_marketer", "src/creative_marketer_api"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=creative_marketer --cov=creative_marketer_api --cov-report=term-missing --cov-fail-under=95"
testpaths = ["tests"]
markers = [
  "postgres: requires a real PostgreSQL database",
  "temporal: requires the official ephemeral Temporal test server",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]
